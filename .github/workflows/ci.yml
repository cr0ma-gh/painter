name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p painter-app
      - uses: actions/upload-artifact@v4
        with:
          name: painter-windows
          path: target/release/painter.exe

  ipad:
    name: iPad build (unsigned .ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build and package
        run: bash ios/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: painter-ipad-unsigned
          path: ios/build/Painter-unsigned.ipa

  linux:
    name: Linux build, tests and AppImage
    # The oldest supported runner: the AppImage then runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: System libraries (GTK 3 file dialogs, X11, Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
          # Mesa's software OpenGL, for the GPU tests on the OpenGL path (Android's Mali GPUs use it).
          sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri
      # The GPU tests are left out: the runner only has Mesa's software renderer.
      - name: Tests
        run: |
          cargo test --workspace --exclude painter-render
          cargo test -p painter-render --lib
      - name: GPU tests on OpenGL (Mesa, informational)
        continue-on-error: true
        env:
          WGPU_BACKEND: gl
        run: cargo test -p painter-render --test gpu_parity -- --nocapture --test-threads 1 tiles_read_their_own_texels composite_matches_cpu_flatten
      - name: Build and package
        run: bash packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: painter-linux-appimage
          path: target/appimage/Painter-x86_64.AppImage

  macos:
    name: macOS app (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Build and package
        run: bash packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: painter-macos
          path: target/macos/Painter.dmg

  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build and package
        run: bash packaging/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: painter-android
          path: target/release/apk/Painter.apk

  release:
    name: GitHub release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ipad, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the files and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp artifacts/painter-windows/painter.exe dist/Painter-windows-x86_64.exe
          cp artifacts/painter-macos/Painter.dmg dist/Painter-macos.dmg
          cp artifacts/painter-linux-appimage/Painter-x86_64.AppImage dist/Painter-linux-x86_64.AppImage
          cp artifacts/painter-android/Painter.apk dist/Painter-android-arm64.apk
          cp artifacts/painter-ipad-unsigned/Painter-unsigned.ipa dist/Painter-ipad-unsigned.ipa
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Painter $GITHUB_REF_NAME" --generate-notes
