[package]
name = "painter-android"
description = "Painter on Android: the app as a NativeActivity library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Android loads the app as a shared library (libpainter_android.so).
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
painter-app = { path = "../painter-app" }
eframe = { workspace = true, features = ["android-native-activity"] }
# The activity handle eframe takes (same winit as eframe's).
winit = { version = "0.30", features = ["android-native-activity"] }

# Packaging with cargo-apk (see android/build.sh).
[package.metadata.android]
package = "io.github.cr0ma_gh.painter"
apk_name = "Painter"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false
version = 1

[[package.metadata.android.uses_feature]]
opengles_version = [3, 1]
required = true

# Network scanners (AirScan): the network, and mDNS multicast on Wi-Fi.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

# The device's files (Download, Documents, Pictures): "All files access" on
# Android 11+, the storage permissions before.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[package.metadata.android.application]
label = "Painter"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|density|uiMode"
launch_mode = "singleTop"

# "Open with" from file managers and other apps: Painter projects, Photoshop,
# Krita, OpenRaster, Clip Studio and pictures (read once at startup).
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [
    { scheme = "content", mime_type = "application/x-painter" },
    { scheme = "content", mime_type = "image/vnd.adobe.photoshop" },
    { scheme = "content", mime_type = "application/x-krita" },
    { scheme = "content", mime_type = "image/openraster" },
    { scheme = "content", mime_type = "application/zip" },
    { scheme = "content", mime_type = "application/octet-stream" },
    { scheme = "content", mime_type = "image/png" },
    { scheme = "content", mime_type = "image/jpeg" },
]
