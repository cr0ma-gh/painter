[package]
name = "painter-app"
description = "Painter desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "painter"
path = "src/main.rs"

[build-dependencies]
# Compiles the iPadOS document picker (native/ios_files.m); unused elsewhere.
cc = "1"

[dependencies]
painter-core.workspace = true
painter-render.workspace = true
painter-brush-io.workspace = true
painter-scanner-io.workspace = true
painter-vector-export.workspace = true
painter-transform-tools.workspace = true
painter-comic-layout.workspace = true
painter-scene-3d.workspace = true
painter-ui-workspace.workspace = true
serde_json.workspace = true
image.workspace = true
eframe.workspace = true
egui_extras.workspace = true
serde.workspace = true
raw-window-handle.workspace = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Screen-reader support and system file dialogs on the desktop.
eframe = { workspace = true, features = ["accesskit"] }
rfd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# winit needs a window system; both, so the app runs under X11 and Wayland.
eframe = { workspace = true, features = ["x11", "wayland"] }
# Pen tablets through XInput2 (libX11 and libXi loaded at run time), and
# winit itself to start on X11 (XWayland under Wayland) where XInput2 works.
x11-dl = "2.21"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
# The activity (keyboard), and the Java VM for storage access, the clipboard
# and the Wi-Fi multicast lock (see src/android.rs).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
ndk-context = "0.1"

[target.'cfg(windows)'.dependencies]
libloading.workspace = true
# Videos on the reference board (Media Foundation).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
# Pasting pictures onto the reference board (already used by egui for text).
arboard = { version = "3.7", default-features = false, features = ["image-data"] }

[dev-dependencies]
# The thumbnail provider's class id, checked against the app's copy.
painter-shell = { path = "../painter-shell" }
