[package]
name = "painter-app"
description = "Painter desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "painter"
path = "src/main.rs"

[build-dependencies]
# Compiles the iPadOS document picker (native/ios_files.m); unused elsewhere.
cc = "1"

[dependencies]
painter-core.workspace = true
painter-render.workspace = true
painter-brush-io.workspace = true
painter-scanner-io.workspace = true
painter-vector-export.workspace = true
painter-transform-tools.workspace = true
painter-comic-layout.workspace = true
painter-scene-3d.workspace = true
painter-ui-workspace.workspace = true
serde_json.workspace = true
image.workspace = true
eframe.workspace = true
egui_extras.workspace = true
serde.workspace = true
raw-window-handle.workspace = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Screen-reader support and system file dialogs on the desktop.
eframe = { workspace = true, features = ["accesskit"] }
rfd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# winit needs a window system; both, so the app runs under X11 and Wayland.
eframe = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
libloading.workspace = true

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
# Pasting pictures onto the reference board (already used by egui for text).
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
