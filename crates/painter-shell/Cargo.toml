[package]
name = "painter-shell"
description = "Windows Explorer thumbnails for Painter projects (a COM thumbnail provider)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "painter_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1.1"
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.58"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com"] }
