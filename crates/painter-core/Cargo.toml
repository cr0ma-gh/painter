[package]
name = "painter-core"
description = "Document model, sparse tile storage, brush engine and file IO for Painter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
# OpenRaster / Krita containers (already in the dependency tree through png and resvg).
flate2 = "1.1"
crc32fast = "1.5"
roxmltree = "0.19"
# Text layers: glyph outlines and font names (already in the tree through egui).
ab_glyph = "0.2"
ttf-parser = "0.25"
# CMYK: colour conversion through ICC profiles (Little CMS, MIT; its C source is built in).
lcms2 = "6"
